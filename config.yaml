# =====================================================================
# 三丰云免费产品自动延期脚本 - 配置文件
# 博客园发文 + 三丰云填表 + 钉钉通知
# =====================================================================
# ⚠️ 以下为示例配置，请替换为你自己的真实信息！
#   - 三丰云手机号和密码
#   - 博客园邮箱和密码
#   - 钉钉机器人 webhook 和 secret
#   - 产品详情页 URL 中的数字 ID（登录三丰云控制台查看）


# =====================================================================
# 三丰云账号
# =====================================================================
sanfengyun:
  phone: "13800138000"            # ← 替换为你的三丰云手机号
  password: "YourSanfengyunPass"   # ← 替换为你的三丰云密码


# =====================================================================
# 博客园账号（用于发布评测文章）
# =====================================================================
cnblogs:
  login_url: "https://account.cnblogs.com/signin"
  email: "your_email@qq.com"      # ← 替换为你的博客园登录邮箱
  password: "YourCnblogsPass"     # ← 替换为你的博客园密码
  username: "your_username"       # ← 替换为你的博客园用户名（URL 中的）


# =====================================================================
# 钉钉机器人通知（不想用就把 enabled 改成 false）
# =====================================================================
dingtalk:
  enabled: true
  webhook: "https://oapi.dingtalk.com/robot/send?access_token=YOUR_DINGTALK_ACCESS_TOKEN"      # ← 替换为你的钉钉webhook
  secret: "SECYOUR_DINGTALK_SECRET"      # ← 替换为你的钉钉secret
  at_all: false
  at_mobiles: []


# =====================================================================
# 延期产品列表（免费云服务器 / 免费虚拟主机）
# =====================================================================
products:
  - key: "vps"
    name: "免费云服务器"
    ptype: "vps"
    enabled: true
    url: "https://www.sanfengyun.com/control/#/freeServer/100001"      # ← 替换为你的url地址

  - key: "vhost"
    name: "免费虚拟主机"
    ptype: "vhost"
    enabled: true
    url: "https://www.sanfengyun.com/control/#/freeVhost/200002"      # ← 替换为你的url地址


# =====================================================================
# 运行参数
# =====================================================================
settings:
  # 以下两个是遗留字段，当前版本代码未使用，保留仅为兼容旧配置，可忽略
  check_interval: 600
  early_submit_seconds: 60
  # 部署到服务器后改成 false 真提交；测试期间保持 true 只填表单不提交
  dry_run: false
  sanitize_keywords:
    - "三丰云"
    - "三丰"
  # 扫描范围：
  #   all    = 扫描云服务器 + 虚拟主机（默认）
  #   vps    = 只扫描免费云服务器
  #   vhost  = 只扫描免费虚拟主机
  scan_scope: "all"


# =====================================================================
# 日志配置
# =====================================================================
logging:
  level: "INFO"
  # 服务器上建议填日志路径，例如 "/root/sanfengyun/run.log"
  file: ""
  console: true
